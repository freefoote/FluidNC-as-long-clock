board: MKS-DLC32
name: Long Clock
meta: Daniel Foote
kinematics: {}
stepping:
  engine: I2S_STATIC
  idle_ms: 254
  pulse_us: 6
  dir_delay_us: 10
  disable_delay_us: 0
axes:
  shared_stepper_disable_pin: i2so.0
  x:
    steps_per_mm: 43.529
    max_rate_mm_per_min: 20000
    acceleration_mm_per_sec2: 1000
    max_travel_mm: 2300
    soft_limits: true
    homing:
      cycle: 1
      positive_direction: false
      mpos_mm: 0
      feed_mm_per_min: 300
      seek_mm_per_min: 6000
      settle_ms: 500
      seek_scaler: 1.1
      feed_scaler: 1.1
    motor0:
      limit_neg_pin: gpio.36
      hard_limits: false
      pulloff_mm: 1
      stepstick:
        step_pin: i2so.1
        direction_pin: i2so.2:low
        disable_pin: NO_PIN
        ms1_pin: NO_PIN
        ms2_pin: NO_PIN
        ms3_pin: NO_PIN
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
i2so:
  bck_pin: gpio.16
  data_pin: gpio.21
  ws_pin: gpio.17
spi:
  miso_pin: gpio.12
  mosi_pin: gpio.13
  sck_pin: gpio.14
sdcard:
  cs_pin: gpio.15
  card_detect_pin: gpio.39
macros:
  macro0: $SD/Run=lasertest.gcode
  macro1: $SD/Run=home.gcode
coolant:
  flood_pin: NO_PIN
  mist_pin: NO_PIN
  delay_ms: 0
user_outputs:
  analog0_pin: NO_PIN
  analog1_pin: NO_PIN
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN
  digital1_pin: NO_PIN
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
start:
  must_home: true

# Perth UTC+8
long_clock_sntp:
  ntp_server: pool.ntp.org
  sync_interval_s: 3600
  utc_offset_s: 28800
  dst_offset_s: 0

# long_clock:
#   enabled: true
#   hour24: false # 12h mode
#   pos_start_mm: 0.0 # position for 12:00 / 00:00
#   pos_end_mm: 2300.0 # position for 11:59 / 23:59
#   feed_mm_min: 3000.0
#   rapid: false

long_clock:
  enabled: true
  hour24: true
  pos_start_mm: 0.0
  pos_end_mm: 300.0
  feed_mm_min: 3000.0
  rapid: false
